<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Fabdia Media — Share photos and videos, follow friends and chat</title>

<!-- installable app -->

      "@id": "https://fabdia.vercel.app/#app",

<body>
<div id="app">

    <p>Share photos and videos, follow friends and chat in real time. Free to join.</p>

</div>
